name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 字面必须与 CONTRIBUTING.md/本地门禁一字一致（M6-B 成文纪律）。
      - run: cargo test --workspace
        # 含 demo 冒烟钉（crates/live-server/tests/demo_cli.rs：
        # CARGO_BIN_EXE 实跑 `live-audience demo -c` 正/负例）与 wiremock 全链；
        # 真实端点永远 opt-in（VTD_AGENT_CHECK=1 不设即不读 config，见 CONTRIBUTING）。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
