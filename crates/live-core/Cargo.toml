[package]
name = "live-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Engine library: bilibili collection, episodes, agent protocol, temporal graph"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
schemars = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
chrono = "0.4"
regex = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
