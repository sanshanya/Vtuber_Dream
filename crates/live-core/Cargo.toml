[package]
name = "live-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Engine library: bilibili collection, episodes, agent protocol, temporal graph"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.12"
schemars = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
md5 = { package = "md-5", version = "0.10" }
sha1 = "0.10"
sha2 = "0.10"
chrono = "0.4"
regex = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
async-openai = { version = "0.41.3", features = ["byot", "chat-completion", "middleware"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
reqwest13 = { version = "0.13", package = "reqwest" }
blake2 = "0.10.6"
flate2 = "1"
brotli = "7"
# WS 会话录制引擎（R2 批 2 D1 第二段 2A）。TLS 走 rustls（native roots）——
# 工作区 reqwest 0.12/0.13 均为 rustls 栈（见 Cargo.lock hyper-rustls/tokio-rustls），
# 不引 native-tls，避免双 TLS 栈。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
