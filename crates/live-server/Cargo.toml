[package]
name = "live-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "axum server + headless run modes on top of live-core"

[[bin]]
name = "live-audience"
path = "src/main.rs"

[dependencies]
live-core = { path = "../live-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.12"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tempfile = "3"
# M5-D2 delta 布景：手工 SQL 栽 graph_runs/edges（graph_delta.rs 同法）。
# 版本必须与 live-core 的对齐：libsqlite3-sys links=sqlite3 单链接约束。
rusqlite = { version = "0.32", features = ["bundled"] }
