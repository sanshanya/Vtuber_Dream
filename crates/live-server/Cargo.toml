[package]
name = "live-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "axum server + headless run modes on top of live-core"

[[bin]]
name = "live-audience"
path = "src/main.rs"

[dependencies]
live-core = { path = "../live-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.12"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }
# Z6/P0-6：graph payload 物化通道（ETag = sha256 前缀；trio 预压缩 = gzip fast + brotli q5）。
sha2 = "0.10"
flate2 = "1"
brotli = "7"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tempfile = "3"
# app_runs_e2e_ws：D1「WS 弹幕窗」e2e 的本机 TCP mock（与 live-core/tests/live_ws_session.rs 同源）。
futures-util = "0.3"
tokio-tungstenite = "0.24"
# 测试面补齐 tokio 能力（net/io-util/time）供 WS mock 的 listener + accept_async 使用。
tokio = { version = "1", features = ["net", "io-util", "time"] }
# app_delta 布景时钟：delta 时间戳从运行时刻派生（日历炸弹免疫），与 live-core 同版系。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# M5-D2 delta 布景：手工 SQL 栽 graph_runs/edges（graph_delta.rs 同法）。
# 版本必须与 live-core 的对齐：libsqlite3-sys links=sqlite3 单链接约束。
rusqlite = { version = "0.32", features = ["bundled"] }
